<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F1F3EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101512" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<title>404 – Referenskortet / The Referral Card</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#F1F3EE;color:#101512;font-family:"Work Sans",sans-serif;line-height:1.6}
main{width:100%;max-width:560px;padding:clamp(24px,6vw,48px);border:1px solid #C9A45C;border-radius:20px}
.code{margin:0;color:#1E5A43;font-size:1rem;font-weight:600;letter-spacing:.12em}
h1,h2{font-family:"Cormorant Garamond",Georgia,serif;line-height:1.15}
h1{margin:12px 0;font-size:clamp(2rem,6vw,3rem)}
h2{margin:0 0 12px;font-size:1.8rem}
section{margin-top:28px;padding-top:24px;border-top:1px solid #C9A45C}
a{display:inline-block;margin-top:8px;color:#1E5A43;font-weight:600;text-underline-offset:4px}
a:focus-visible{outline:3px solid #C9A45C;outline-offset:5px}
@media(prefers-color-scheme:dark){
body{background:#101512;color:#F3EDE0}
.code,a{color:#C9A45C}
}
</style>
</head>
<body>
<main>
<p class="code">404 · REFERENSKORTET</p>
<h1>Sidan hittades inte</h1>
<p>Adressen kan ha ändrats eller skrivits fel. Gå till startsidan för att skapa ditt referenskort.</p>
<a href="/">Till startsidan</a>
<section lang="en" aria-labelledby="english-title">
<h2 id="english-title">Page not found</h2>
<p>The address may have changed or been mistyped. Visit the home page to create your referral card.</p>
<a href="/">Go to the home page</a>
</section>
</main>
</body>
</html>
