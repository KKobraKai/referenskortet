<style>
/* Layout: two-pane workbench — numbered steps on the left, a live print proof pinned on the right; stacks on phones. */
:root{
  color-scheme:light;
  --bg:#F1F3EE; --surface:#FFFFFF; --ink:#18211C; --muted:#56605A; --line:#D5DBD1;
  --accent:#1E5A43; --accent-ink:#FFFFFF; --accent-soft:#DCEBE2; --gold:#80601E;
  --warn:#805000; --warn-soft:#F7EBD6; --bad:#A12B2B; --bad-soft:#F6E0DE; --ok:#285F37; --chip:#E9EDE5;
  --proof:#DCE1D8;
  --f-display:"Cormorant Garamond", Georgia, "Times New Roman", serif;
  --f-body:"Work Sans", "Helvetica Neue", Arial, sans-serif;
  --r:10px;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px;
  --control-line:#829087;
  --shadow:0 2px 4px rgba(24,33,28,.025),0 12px 32px rgba(24,33,28,.045);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#101512; --surface:#18201B; --ink:#E6EBE4; --muted:#AAB5AD; --line:#354239;
    --accent:#73C29A; --accent-ink:#0D1510; --accent-soft:#1F3A2C; --gold:#D5B062;
    --warn:#E3B166; --warn-soft:#3A2C17; --bad:#F09090; --bad-soft:#3B1D1D; --ok:#8AD3A1; --chip:#222B25;
    --proof:#0B0F0D; --control-line:#718278;
    --shadow:0 2px 4px rgba(0,0,0,.08),0 12px 32px rgba(0,0,0,.14);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#101512; --surface:#18201B; --ink:#E6EBE4; --muted:#AAB5AD; --line:#354239;
  --accent:#73C29A; --accent-ink:#0D1510; --accent-soft:#1F3A2C; --gold:#D5B062;
  --warn:#E3B166; --warn-soft:#3A2C17; --bad:#F09090; --bad-soft:#3B1D1D; --ok:#8AD3A1; --chip:#222B25;
  --proof:#0B0F0D; --control-line:#718278;
  --shadow:0 2px 4px rgba(0,0,0,.08),0 12px 32px rgba(0,0,0,.14);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:var(--f-body);
  font-size:15px;
  line-height:1.6;
  -webkit-text-size-adjust:100%;
}
button,input,select,textarea{font:inherit}
button,a,input,select,textarea,label{-webkit-tap-highlight-color:transparent}
button{touch-action:manipulation}
a{color:var(--accent);text-underline-offset:3px;text-decoration-thickness:1px}
a:hover{text-decoration-thickness:2px}
:where(button,a,input,select,textarea,summary,[tabindex]):focus-visible{
  outline:3px solid var(--accent);
  outline-offset:3px;
}
.wrap{
  max-width:1360px;
  margin:0 auto;
  padding:var(--s6) clamp(16px,3vw,40px) var(--s7);
}
h1,h2,h3,h4{margin:0;text-wrap:balance}
h1,h2{font-family:var(--f-display);font-weight:600;letter-spacing:-.025em}
h1{font-size:clamp(32px,4vw,44px);line-height:1.05}
h2{font-size:32px;line-height:1.15}
h3{font-size:15px;font-weight:600;line-height:1.4;margin-top:var(--s5)}
h4{
  font-size:12px;
  font-weight:600;
  letter-spacing:.07em;
  text-transform:uppercase;
  color:var(--muted);
  margin:var(--s4) 0 var(--s1);
}
p{margin:0}
.top{
  display:flex;
  flex-wrap:wrap;
  gap:var(--s5) var(--s6);
  align-items:center;
  justify-content:space-between;
  padding-bottom:var(--s5);
  margin-bottom:var(--s5);
  border-bottom:1px solid var(--line);
}
.brand{min-width:0}
.brand p{color:var(--muted);margin-top:var(--s2);max-width:60ch;font-size:14px}
.prefs{display:flex;flex-wrap:wrap;gap:var(--s3);align-items:end}
.prefs .f{flex:1 1 140px}
label.f{
  display:flex;
  flex-direction:column;
  gap:6px;
  font-size:13px;
  font-weight:500;
  color:var(--muted);
  min-width:0;
}
select,input[type=text],input[type=email],input[type=tel],input[type=url],
input[type=search],input[type=number],textarea{
  width:100%;
  min-width:0;
  min-height:44px;
  padding:10px 12px;
  border:1px solid var(--control-line);
  border-radius:var(--r);
  background:var(--surface);
  color:var(--ink);
  font-size:14px;
  line-height:1.5;
  transition:border-color .15s ease,box-shadow .15s ease;
}
select{padding-right:30px}
textarea{resize:vertical;min-height:88px}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:1}
input:focus-visible,select:focus-visible,textarea:focus-visible{border-color:var(--accent)}
input[aria-invalid="true"],select[aria-invalid="true"],textarea[aria-invalid="true"]{
  border-color:var(--bad);
  box-shadow:inset 3px 0 0 var(--bad);
}
@supports selector(input:user-invalid){
  input:user-invalid,select:user-invalid,textarea:user-invalid{
    border-color:var(--bad);
    box-shadow:inset 3px 0 0 var(--bad);
  }
}
input:disabled,select:disabled,textarea:disabled{opacity:.65;cursor:not-allowed}
textarea[readonly]{background:var(--bg)}
.steps{
  margin:var(--s5) 0;
  padding:6px;
  border:1px solid var(--line);
  border-radius:14px;
  background:var(--surface);
  box-shadow:var(--shadow);
  overflow-x:auto;
  scroll-padding-inline:6px;
  scroll-margin-top:var(--s4);
  scrollbar-width:thin;
}
.steps ol{
  list-style:none;
  margin:0;
  padding:0;
  display:flex;
  gap:var(--s1);
  min-width:max-content;
}
.steps li{flex:1 0 auto}
.steps button{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:var(--s2);
  width:100%;
  min-height:46px;
  padding:8px 14px;
  border:1px solid transparent;
  border-radius:9px;
  background:transparent;
  color:var(--muted);
  font-size:13px;
  line-height:1.4;
  cursor:pointer;
}
.steps .num{
  display:inline-grid;
  place-items:center;
  flex:none;
  width:26px;
  height:26px;
  border:1px solid var(--control-line);
  border-radius:50%;
  font-size:12px;
  font-variant-numeric:tabular-nums;
}
.steps button[aria-current="step"]{
  background:var(--accent-soft);
  border-color:var(--accent);
  color:var(--ink);
  font-weight:600;
}
.steps button[aria-current="step"] .num{
  background:var(--accent);
  border-color:var(--accent);
  color:var(--accent-ink);
}
.grid{display:grid;grid-template-columns:minmax(0,1fr);gap:var(--s6)}
.grid>*{min-width:0}
#workbench{scroll-margin-top:var(--s5)}
.panel{
  display:flex;
  flex-direction:column;
  gap:var(--s4);
  min-width:0;
  padding:clamp(18px,2.4vw,28px);
  border:1px solid var(--line);
  border-radius:14px;
  background:var(--surface);
  box-shadow:var(--shadow);
}
.panel>h2{margin-bottom:2px}
.panel>h3{padding-top:var(--s4);border-top:1px solid var(--line);margin-top:var(--s2)}
.lead{color:var(--muted);max-width:62ch}
.note{color:var(--muted);font-size:13px;line-height:1.6;max-width:66ch;overflow-wrap:anywhere}
.row{display:flex;flex-wrap:wrap;gap:var(--s3)}
.row>*{flex:1 1 200px;min-width:0}
.cols2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:var(--s4)}
.stack{display:flex;flex-direction:column;gap:var(--s3);min-width:0}
.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:var(--s2);
  min-height:44px;
  max-width:100%;
  padding:10px 16px;
  border:1px solid var(--control-line);
  border-radius:var(--r);
  background:var(--surface);
  color:var(--ink);
  font-size:14px;
  font-weight:600;
  line-height:1.4;
  text-align:center;
  text-decoration:none;
  cursor:pointer;
  transition:background-color .15s ease,border-color .15s ease,box-shadow .15s ease,transform .15s ease;
}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.small{min-height:36px;padding:7px 12px;font-size:13px}
.btn:active:not(:disabled){transform:translateY(1px);box-shadow:none}
.btn:disabled,.seg button:disabled,.chip:disabled,.steps button:disabled{
  opacity:.55;
  cursor:not-allowed;
  transform:none;
  box-shadow:none;
}
.linkish{
  display:inline-flex;
  align-items:center;
  min-height:36px;
  max-width:100%;
  padding:6px 2px;
  border:0;
  border-radius:4px;
  background:transparent;
  color:var(--accent);
  font-size:13px;
  line-height:1.5;
  text-decoration:underline;
  text-underline-offset:3px;
  cursor:pointer;
}
.linkish:disabled{opacity:.55;cursor:not-allowed}
.card{
  min-width:0;
  padding:var(--s4);
  border:1px solid var(--line);
  border-radius:var(--r);
  background:var(--surface);
}
.chapter{display:flex;flex-wrap:wrap;gap:var(--s3) var(--s4);align-items:center;justify-content:space-between}
.chapter .meta{min-width:0;overflow-wrap:anywhere}
.chapter .nm,.provider .nm{font-weight:600}
.chapter .sub{font-size:13px;color:var(--muted)}
.badge{margin-left:var(--s2);color:var(--gold);font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase}
.check{display:inline-flex;align-items:center;gap:var(--s2);min-height:36px;font-size:14px;line-height:1.5;cursor:pointer}
.check input{flex:none;width:18px;height:18px;margin:0;accent-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:var(--s2)}
.chip{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:36px;
  max-width:100%;
  padding:7px 12px;
  border:1px solid var(--control-line);
  border-radius:999px;
  background:var(--chip);
  color:var(--ink);
  font-size:13px;
  line-height:1.4;
  text-align:left;
  overflow-wrap:anywhere;
  cursor:pointer;
  transition:background-color .15s ease,border-color .15s ease;
}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.chip[aria-pressed="true"]::before{
  content:"";
  flex:none;
  width:9px;
  height:5px;
  margin-right:8px;
  border-left:2px solid currentColor;
  border-bottom:2px solid currentColor;
  transform:translateY(-1px) rotate(-45deg);
}
.chip .x{margin-left:var(--s2);font-weight:600}
.selbar{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:var(--s3) var(--s4);
  position:sticky;
  top:env(safe-area-inset-top,0px);
  z-index:2;
  padding:var(--s3) 0;
  border-bottom:1px solid var(--line);
  background:var(--surface);
}
.count{font-weight:600;font-variant-numeric:tabular-nums}
.msg{padding:var(--s3) var(--s4);border-radius:var(--r);font-size:13px;line-height:1.6;overflow-wrap:anywhere}
.msg.warn{background:var(--warn-soft);color:var(--warn);border-inline-start:3px solid var(--warn)}
.msg.bad{background:var(--bad-soft);color:var(--bad);border-inline-start:3px solid var(--bad)}
.msg.ok{background:var(--accent-soft);color:var(--ok);border-inline-start:3px solid var(--ok)}
.seg{display:flex;flex-wrap:wrap;gap:var(--s2)}
.seg button{
  min-height:40px;
  padding:8px 13px;
  border:1px solid var(--control-line);
  border-radius:var(--r);
  background:var(--surface);
  color:var(--ink);
  font-size:13px;
  line-height:1.4;
  cursor:pointer;
}
.seg button[aria-pressed="true"]{
  border-color:var(--accent);
  background:var(--accent-soft);
  box-shadow:inset 0 0 0 1px var(--accent);
  font-weight:600;
}
.seg .swatch,.swatch{
  position:relative;
  flex:none;
  width:44px;
  height:44px;
  min-height:44px;
  padding:0;
  border:2px solid var(--control-line);
  border-radius:50%;
  cursor:pointer;
}
.seg .swatch[aria-pressed="true"],.swatch[aria-pressed="true"]{
  border-color:var(--ink);
  box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--accent);
}
.swatch i{position:absolute;right:4px;bottom:4px;width:12px;height:12px;border-radius:50%}
fieldset{display:flex;flex-direction:column;gap:var(--s2);min-width:0;margin:0;padding:0;border:0}
legend{padding:0;margin-bottom:var(--s2);font-size:13px;font-weight:500;color:var(--muted)}
details summary{cursor:pointer;font-weight:600;font-size:14px;line-height:1.5;border-radius:4px}
details summary::marker{color:var(--accent)}
details[open] summary{margin-bottom:var(--s4)}
.navbtns{display:flex;flex-wrap:wrap;justify-content:space-between;gap:var(--s3);margin-top:var(--s5)}
.navbtns .btn{min-width:110px}
.preview{align-self:start;min-width:0}
.preview-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:var(--s3);margin-bottom:var(--s3)}
.preview-head h2{line-height:1.2}
.preview-head .check{font-size:13px}
.proof{
  display:flex;
  flex-direction:column;
  gap:var(--s5);
  padding:clamp(12px,2vw,22px);
  border:1px solid var(--line);
  border-radius:14px;
  background:var(--proof);
}
.proof canvas{
  display:block;
  width:100%;
  height:auto;
  border-radius:2px;
  background:#fff;
  box-shadow:0 1px 3px rgba(0,0,0,.16),0 8px 20px rgba(0,0,0,.12);
}
.proof figure{display:flex;flex-direction:column;gap:var(--s2);min-width:0;margin:0}
.proof figcaption{
  display:flex;
  flex-wrap:wrap;
  justify-content:space-between;
  align-items:baseline;
  gap:var(--s1) var(--s3);
  color:var(--muted);
  font-size:12px;
  line-height:1.5;
}
.proof figcaption>span{min-width:0;overflow-wrap:anywhere}
.proof figcaption>span:first-child{font-weight:600}
.provider{display:grid;gap:var(--s2)}
.provider .hd{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:6px var(--s3)}
.kind{padding:3px 9px;border-radius:999px;background:var(--chip);color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.kind.pm{background:var(--accent-soft);color:var(--ok)}
dl.facts{display:grid;grid-template-columns:fit-content(40%) minmax(0,1fr);gap:6px var(--s4);margin:0;font-size:13px}
dl.facts dt{color:var(--muted);overflow-wrap:anywhere}
dl.facts dd{min-width:0;margin:0;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;border:0;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}
.row>div:has(>input[type="file"]:focus-visible)>label.btn{outline:3px solid var(--accent);outline-offset:3px}

/* Landing: a restrained introduction with one clear next action. */
.landing{display:flex;flex-direction:column;align-items:flex-start;gap:var(--s4);padding:var(--s4) 0 var(--s6)}
.landing-kicker{margin:0;color:var(--gold);font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.landing h2{max-width:26ch;font-size:clamp(32px,4vw,44px);line-height:1.08}
.landing-pitch{max-width:54ch;margin:0;color:var(--ink);font-size:16px;line-height:1.65}
.landing-pitch strong{color:var(--accent);font-weight:600}
.landing-uses{display:flex;flex-wrap:wrap;gap:var(--s2) var(--s4);list-style:none;margin:var(--s1) 0;padding:0;max-width:80ch}
.landing-uses li{display:flex;align-items:baseline;gap:var(--s2);max-width:100%;color:var(--muted);font-size:13px;line-height:1.5;overflow-wrap:anywhere}
.landing-uses li::before{content:"";flex:none;width:5px;height:5px;border-radius:50%;background:var(--accent);align-self:center}
.landing-cta{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s3);margin-top:var(--s2)}
.landing-cta .btn.primary{min-height:48px;padding:12px 24px;font-size:15px}
.landing-note{max-width:60ch;color:var(--muted);font-size:13px;line-height:1.6}
.hero-strip{
  display:flex;
  gap:var(--s4);
  overflow-x:auto;
  margin:var(--s2) 0 var(--s3);
  padding:var(--s2) 6px var(--s4);
  scroll-padding-inline:6px;
  scroll-snap-type:x proximity;
  scrollbar-width:thin;
}
.hero-strip::-webkit-scrollbar{height:6px}
.hero-strip::-webkit-scrollbar-thumb{background:var(--control-line);border-radius:999px}
.hero-card{
  flex:0 0 auto;
  width:min(60vw,220px);
  padding:0;
  border:0;
  border-radius:4px;
  background:transparent;
  color:inherit;
  text-align:left;
  cursor:pointer;
  scroll-snap-align:start;
}
.hero-card canvas{
  display:block;
  width:100%;
  height:auto;
  border-radius:3px;
  background:#fff;
  box-shadow:0 1px 3px rgba(0,0,0,.14),0 6px 16px rgba(0,0,0,.09);
  transition:box-shadow .15s ease;
}
.hero-card .hero-cap{display:block;margin-top:var(--s3);color:var(--muted);font-size:12px;font-weight:500;line-height:1.5}
.hero-card[aria-pressed="true"] .hero-cap{color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:4px}
.hero-card[aria-pressed="true"] canvas{box-shadow:0 0 0 3px var(--accent),0 6px 16px rgba(0,0,0,.09)}
#landing{margin:var(--s2) 0 var(--s5);border-bottom:1px solid var(--line)}

@media (hover:hover){
  .btn:hover:not(:disabled){background:var(--chip);border-color:var(--accent)}
  .btn.primary:hover:not(:disabled){background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .chip:hover:not(:disabled){border-color:var(--accent)}
  .seg button:hover:not(:disabled){border-color:var(--accent)}
  .steps button:hover:not(:disabled){color:var(--ink);border-color:var(--control-line)}
  .linkish:hover:not(:disabled){text-decoration-thickness:2px}
  .hero-card:hover canvas{box-shadow:0 0 0 2px var(--accent),0 6px 16px rgba(0,0,0,.09)}
}
@media (min-width:1000px){

let cityTimer = 0;
$("findCity").oninput = e => { S.city = e.target.value; save(); clearTimeout(cityTimer); cityTimer = setTimeout(() => { renderChapters(); $("findCity").focus(); $("imgPrompt").value = imgPrompt(); }, 500); };
["chChips", "libBiz", "libPriv", "ownChips", "aiChips"].forEach(id => $(id).addEventListener("click", e => { const b = e.target.closest("[data-key]"); if (b) toggleSel(b.dataset.key); }));
$("showAll").onclick = () => { S.showAll = !S.showAll; save(); renderTrades(); };
$("clearSel").onclick = () => { S.selected = []; save(); renderTrades(); schedule(); };
$("order").onchange = e => { S.order = e.target.value; save(); schedule(); };
$("ownInput").onkeydown = e => {
  if (e.key !== "Enter") return; e.preventDefault();
  const v = e.target.value.trim(); if (!v) return;
  const key = findLib(v) || "txt:" + v;
  if (key.startsWith("txt:") && !S.own.includes(v)) S.own.push(v);
  if (!S.selected.includes(key)) S.selected.push(key);
  e.target.value = ""; save(); renderTrades(); schedule();
};
$("aiBtn").onclick = aiSuggest;
$("edition").onchange = e => { S.edition = e.target.value; S.edPick = true; S.palette = EDITIONS[S.edition].pal; S.text = { head: null, sub: null, backHead: null, body: null }; save(); renderCardForm(); schedule(); };
$("cardLang").onchange = e => { S.cardLang = e.target.value; S.text = { head: null, sub: null, backHead: null, body: null }; save(); renderCardForm(); renderTrades(); schedule(); };
$("layoutSeg").onclick = e => { const b = e.target.closest("[data-layout]"); if (!b) return; S.layout = b.dataset.layout; save(); renderCardForm(); schedule(); };
$("paletteSeg").onclick = e => { const b = e.target.closest("[data-pal]"); if (!b) return; S.palette = b.dataset.pal; save(); renderCardForm(); schedule(); };
$("style").onchange = e => { S.style = e.target.value; save(); $("imgPrompt").value = imgPrompt(); };
let imageObjectUrl = "";
$("imgFile").onchange = e => {
  const f = e.target.files && e.target.files[0]; if (!f) return;
  if (imageObjectUrl) URL.revokeObjectURL(imageObjectUrl);
  const url = imageObjectUrl = URL.createObjectURL(f);
  const img = new Image();
  img.onload = () => {
    if (imageObjectUrl !== url) return;
    IMG = img; IMG_NAME = f.name; renderCardForm(); schedule();
  };
  img.onerror = () => {
    if (imageObjectUrl !== url) return;
    URL.revokeObjectURL(url); imageObjectUrl = "";
    $("imgStatus").textContent = t("img_bad");
  };
  img.src = url;
  e.target.value = "";
};
$("copyPrompt").onclick = async () => {
  const ta = $("imgPrompt");
  try { await navigator.clipboard.writeText(ta.value); $("copyPrompt").textContent = t("copied"); setTimeout(() => $("copyPrompt").textContent = t("copy"), 1600); }
  catch (e) { ta.focus(); ta.select(); }
};
Object.entries(TEXT_INPUTS).forEach(([k, id]) => $(id).addEventListener("input", e => { const v = e.target.value; S.text[k] = v === defText(k) ? null : v; save(); schedule(); }));
$("resetText").onclick = () => { S.text = { head: null, sub: null, backHead: null, body: null }; save(); renderCardForm(); schedule(); };
Object.entries(SENDER_INPUTS).forEach(([k, id]) => $(id).addEventListener("input", e => { S.sender[k] = e.target.value; save(); schedule(); }));
$("showCh").onchange = e => { S.showCh = e.target.checked; save(); renderCardForm(); schedule(); };
$("stamp").onchange = e => { S.stamp = e.target.checked; save(); schedule(); };
$("showShare").onchange = e => { S.showShare = e.target.checked; save(); schedule(); };
$("shareUrl").addEventListener("input", e => { S.shareUrl = e.target.value; save(); schedule(); });
$("copyShare").onclick = async () => {
  const url = publicShareUrl();
  try { await navigator.clipboard.writeText(url); $("copyShare").textContent = t("link_copied"); setTimeout(() => $("copyShare").textContent = t("copy_link"), 1600); }
  catch (e) {
    const ta = document.createElement("textarea"); ta.value = url; document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); $("copyShare").textContent = t("link_copied"); setTimeout(() => $("copyShare").textContent = t("copy_link"), 1600); } catch (err) {}
    document.body.removeChild(ta);
  }
};
$("size").onchange = e => { S.size = e.target.value; save(); renderCardForm(); schedule(); };
$("bleed").onchange = e => { S.bleed = +e.target.value; save(); renderCardForm(); schedule(); };
$("trim").checked = S.trim;
$("trim").onchange = e => { S.trim = e.target.checked; save(); schedule(); };
let recTimer = 0;
$("recText").addEventListener("input", e => { clearTimeout(recTimer); recTimer = setTimeout(() => setRecipients(parseText(e.target.value)), 250); });
$("recFile").onchange = async e => {
  const f = e.target.files && e.target.files[0]; if (!f) return;
  if (f.size > 10 * 1024 * 1024) {
    status("bad", t("file_big")); e.target.value = ""; return;
  }
  try { const list = await readRecFile(f); $("recText").value = list.map(r => r.lines.join("\n")).join("\n\n"); setRecipients(list); status("ok", t("rec_n", { n: list.length })); }
  catch (err) { status("bad", t("dl_err")); }
  e.target.value = "";
};
$("recClear").onclick = () => { $("recText").value = ""; setRecipients([]); status("", ""); };
$("dlPrint").onclick = () => doDownload("print");
$("dlAddr").onclick = () => doDownload("addr");
$("dlCsv").onclick = () => doDownload("csv");
window.addEventListener("resize", schedule);

$("makeYours").onclick = () => enterWorkbench();

// ---------- Boot ----------
renderAll();
if (document.fonts) {
  Promise.all(["600 40px \"Cormorant Garamond\"", "400 20px \"Work Sans\"", "600 20px \"Work Sans\""].map(f => document.fonts.load(f).catch(() => {})))
    .then(() => schedule());
  document.fonts.ready.then(() => schedule());
}
(async () => {
  try {
    if (window.claude && window.claude.use) { const s = await window.claude.use("sample"); if (s) { SAMPLE = s; renderAiBox(); } }
  } catch (e) {}
})();
</script>
</body></html>
